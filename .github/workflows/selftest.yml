name: Twin Gardens Selftest
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: The Proving Ritual (38 checks, zero dependencies)
        run: node Twin_Gardens.js selftest
      - name: Stratum witness gate (a fork without the secret fails here)
        env:
          HAS_STRATUM: ${{ secrets.STRATUM }}
        run: |
          if [ -z "$HAS_STRATUM" ]; then
            echo '::error::STRATUM witness secret not present - refusing to witness this run.'
            exit 1
          fi
      - name: Witness acknowledged
        env:
          HAS_STRATUM: ${{ secrets.STRATUM }}
        run: |
          if [ -n "$HAS_STRATUM" ]; then
            echo 'Witnessed by Stratum. Continue. Persist. Exist.'
          fi
